kind: Agent
name: osv
version: 0.10.2
description: |
  This repository is an implementation of [Ostorlab Agent](https://pypi.org/project/ostorlab/) for the [OSV Scanner](https://github.com/google/osv-scanner).
license: Apache-2.0
in_selectors:
  - v3.asset.file
  - v3.fingerprint.file
  - v3.asset.link
  - v3.asset.repository
  - v3.asset.file.repository_archive
out_selectors:
  - v3.report.vulnerability
args:
  - name: "nvd_api_key"
    type: "string"
    description: "NVD api key."
  - name: "exclude_path_regexes"
    type: "array"
    description: "List of regex patterns; files whose path matches any pattern are skipped."
  - name: "scope_urls_regex"
    type: "string"
    description: "Regular expression of the URLs in the scan scope, matched with re.match against the start of the link URL without its user:password@ part. Dependency files behind out-of-scope links are neither downloaded nor reported; files and repositories are not filtered. Anchor the end of the host to exclude look-alike hosts such as <domain>.evil.com. Empty means no filtering."
docker_file_path : Dockerfile
docker_build_root : .
volumes:
  - name: repository_code
    path: /code
    read_only: true
